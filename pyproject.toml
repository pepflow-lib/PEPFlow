[project]
name = "pepflow"
version = "0.1.8"
description = "PEPFlow: A framework for Performance Estimation Problem (PEP) Workflow"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "attrs>=25.3.0",
    "cvxpy>=1.7.1",
    "dash>=3.2.0",
    "dash-bootstrap-components>=2.0.3",
    "ipykernel>=7.1.0",
    "isort>=6.0.1",
    "matplotlib>=3.9.4",
    "natsort>=8.4.0",
    "numpy>=2.0.2",
    "pandas>=2.3.1",
    "plotly>=6.3.0",
    "pytest>=8.4.1",
    "ruff>=0.12.4",
    "regex",
    "sympy>=1.14.0",
]

[tool.setuptools.packages.find]
include = ["pepflow", "pepflow.*"]

[tool.pytest.ini_options]
# Maintained suites; archived trial programs run through the replay tools.
testpaths = [
    "pepflow",
    "plugins/pepflow-workflows/tests",
    "examples_peppy/_evaluations/supplementary/tools/tests",
]
# Resolve the checkout consistently for both pytest and python -m pytest.
pythonpath = ["."]
# Retain pytest defaults and exclude archives even when an IDE runs pytest .
norecursedirs = [
    "*.egg", ".*", "_darcs", "build", "CVS", "dist", "node_modules", "venv", "{arch}",
    "*/examples_peppy/_evaluations/*/r[0-9][0-9]",
    "*/examples_peppy/_evaluations/supplementary/tools/framework",
]

[tool.ruff]
line-length = 88
# Historical framework bytes are verified by the archive audit.
extend-exclude = ["examples_peppy/_evaluations/supplementary/tools/framework"]

[tool.ruff.format]
# Enable reformatting of code snippets in docstrings.
docstring-code-format = true
docstring-code-line-length = 80
exclude = ["generated"]

[tool.isort]
profile = "black"
skip_gitignore = true
line_length = 88
extend_skip = ["examples_peppy/_evaluations/supplementary/tools/framework"]
ensure_newline_before_comments=true

[tool.ty.src]
# Check the maintained pepflow package once; preserve the historical snapshot.
exclude = ["examples_peppy/_evaluations/supplementary/tools/framework"]

[tool.ty.rules]
invalid-argument-type = "ignore"
unsupported-operator = "ignore"

[tool.pydocstringformatter]
write = true
strip-whitespaces = true
split-summary-body = true
linewrap-full-docstring = true
max-summary-lines = 2
max-line-length=88
